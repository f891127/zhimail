appId: com.zhimail.desktop
productName: 智邮
copyright: Copyright © 2026 fxj (智邮 ZhiYou)

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
  # 瘦身：源码、类型声明、源码映射、文档、示例与测试都不进安装包
  - '!**/*.{map,ts,tsx,mts,cts,d.ts,d.cts,d.mts}'
  - '!**/{README*,CHANGELOG*,LICENSE*,AUTHORS*,NOTICE*,*.md}'
  - '!**/{test,tests,__tests__,example,examples,docs,doc,benchmark,benchmarks}/**'
  - '!**/{.eslintrc,.editorconfig,.prettierrc}/**'
  # docx 同时发布 cjs / mjs / iife / umd 四种构建：main 指向 umd.cjs，只需保留 cjs 与 umd.cjs
  - '!node_modules/docx/**/*.{mjs,iife.js}'

asar: true
asarUnpack:
  - '**/*.node'

# 最大压缩：安装包体积更小，整包更新更快
compression: maximum
# 只保留中英文语言资源，其余 50 多个 Chromium 语言包不打包
electronLanguages:
  - zh-CN
  - en-US
# 打包后清理 Chromium 许可证文件与多余语言包（双保险）
afterPack: scripts/afterPack.cjs

# 在线更新：发布到 GitHub Releases，客户端通过 latest.yml 检查新版本
publish:
  provider: github
  owner: f891127
  repo: zhimail
  releaseType: release
# 把 CHANGELOG.md 中当前版本的说明写入 latest.yml，
# 客户端检查更新时即可直接显示本次更新内容
releaseInfo:
  releaseNotesFile: release-notes.md

win:
  target:
    - target: nsis
      arch:
        - x64
    # 免安装便携版：解压即用，随安装包一并发布到 Release
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  # zip 等默认目标的命名；NSIS 安装包由下方 nsis.artifactName 单独覆盖
  artifactName: ZhiYou-Portable-${version}-x64.${ext}
  executableName: ZhiYou

nsis:
  artifactName: ZhiYou-Setup-${version}-x64.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 智邮
  uninstallDisplayName: 智邮
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  language: '2052'
  installerLanguages:
    - zh_CN
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: true
  # 安装时清理旧版本快捷方式（见 build/installer.nsh）
  include: build/installer.nsh

portable:
  artifactName: ZhiYou-Portable-${version}-x64.${ext}
