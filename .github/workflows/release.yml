name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '以草稿形式发布 Release'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建渲染层与主进程
        run: pnpm build

      - name: 打包并发布到 GitHub Releases
        run: npx electron-builder --win nsis zip --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置代码签名证书时跳过签名，避免打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 确保 Release 为已发布状态
        # electron-builder 有时会把 Release 建成草稿，草稿对客户端不可见会导致自动更新失效
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --title "知邮 ZhiMail ${{ github.ref_name }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ZhiYou-Windows
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
          retention-days: 14
